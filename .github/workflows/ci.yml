name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r apps/api/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check agents apps/api tests
      - name: Test
        run: pytest -q

  schema:
    name: Database schema applies cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: threadmind
          POSTGRES_PASSWORD: threadmind
          POSTGRES_DB: threadmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threadmind"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        run: psql "postgresql://threadmind:threadmind@localhost:5432/threadmind" -v ON_ERROR_STOP=1 -f database/schemas/001_initial.sql
      - name: Assert RLS is enabled on tenant tables
        run: |
          count=$(psql -tA "postgresql://threadmind:threadmind@localhost:5432/threadmind" \
            -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND rowsecurity=true")
          echo "tables with RLS: $count"
          test "$count" -ge 16

  web:
    name: Dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [api]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}-api:main
            ghcr.io/${{ github.repository }}-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
