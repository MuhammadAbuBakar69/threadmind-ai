name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r apps/api/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check agents apps/api tests
      - name: Test
        run: pytest -q

  schema:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: threadmind
          POSTGRES_PASSWORD: threadmind
          POSTGRES_DB: threadmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threadmind"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        run: psql "postgresql://threadmind:threadmind@localhost:5432/threadmind" -v ON_ERROR_STOP=1 -f database/schemas/001_initial.sql
      - name: Apply migrations
        # Forward migrations are 0NN_*.sql; rollbacks are 9NN_rollback_*.sql and must NEVER be
        # applied here. The first version of this loop used [0-9]*, which applied the rollback
        # immediately after the migration and silently undid it - the RLS assertion below then
        # failed with 0 forced tables, which is exactly what a correct assertion should do.
        run: |
          for f in database/migrations/0*.sql; do
            echo "applying $f"
            psql "postgresql://threadmind:threadmind@localhost:5432/threadmind" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Assert RLS is enabled AND forced on tenant tables
        run: |
          query="SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity AND c.relforcerowsecurity"
          forced=$(psql -tA "postgresql://threadmind:threadmind@localhost:5432/threadmind" -c "$query")
          echo "tables with RLS enabled and forced: $forced"
          if [ "$forced" -lt 18 ]; then
            echo "::error::only $forced tables have RLS forced; expected >= 18"
            psql -tA "postgresql://threadmind:threadmind@localhost:5432/threadmind" -c \
              "SELECT relname, relrowsecurity, relforcerowsecurity FROM pg_class c
               JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname='public' AND c.relkind='r' ORDER BY relname"
            exit 1
          fi
      - name: Rollback migration is complete
        run: |
          psql "postgresql://threadmind:threadmind@localhost:5432/threadmind" -v ON_ERROR_STOP=1 -f database/migrations/900_rollback_002.sql
          remaining=$(psql -tA "postgresql://threadmind:threadmind@localhost:5432/threadmind" \
            -c "SELECT count(*) FROM pg_policies WHERE policyname IN ('tenant_isolation','self_membership_lookup')")
          echo "policies remaining after rollback: $remaining"
          test "$remaining" -eq 0

  isolation:
    name: Tenant isolation (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: threadmind
          POSTGRES_PASSWORD: threadmind
          POSTGRES_DB: threadmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threadmind"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+psycopg://threadmind:threadmind@localhost:5432/threadmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r apps/api/requirements.txt
      - name: Prove one tenant cannot reach another
        run: pytest tests/integration -v

  web:
    name: Dashboard builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [api, isolation]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image name
        # github.repository preserves the owner's casing; container registries reject uppercase.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-api" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
