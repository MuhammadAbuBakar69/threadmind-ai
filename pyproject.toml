[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", "apps/web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is a call in a default argument (Depends(...)). That is the
# framework's documented pattern, not a bug.
"apps/api/**" = ["B008"]
